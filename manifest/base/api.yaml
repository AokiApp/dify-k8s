apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: langgenius/dify-api:1.4.0
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: shared-config
            - secretRef:
                name: shared-secret
          env:
            - name: MODE
              value: "api"
            # name differs between the two files
            - name: SENTRY_DSN
              valueFrom:
                configMapKeyRef:
                  name: shared-config
                  key: API_SENTRY_DSN
            - name: SENTRY_TRACES_SAMPLE_RATE
              valueFrom:
                configMapKeyRef:
                  name: shared-config
                  key: API_SENTRY_TRACES_SAMPLE_RATE
            - name: SENTRY_PROFILES_SAMPLE_RATE
              valueFrom:
                configMapKeyRef:
                  name: shared-config
                  key: API_SENTRY_PROFILES_SAMPLE_RATE
            - name: PLUGIN_REMOTE_INSTALL_HOST
              valueFrom:
                configMapKeyRef:
                  name: shared-config
                  key: EXPOSE_PLUGIN_DEBUGGING_HOST
            - name: PLUGIN_REMOTE_INSTALL_PORT
              valueFrom:
                configMapKeyRef:
                  name: shared-config
                  key: EXPOSE_PLUGIN_DEBUGGING_PORT
            - name: PLUGIN_MAX_PACKAGE_SIZE
              valueFrom:
                configMapKeyRef:
                  name: shared-config
                  key: PLUGIN_MAX_PACKAGE_SIZE
            - name: CODE_EXECUTION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: SANDBOX_API_KEY
          volumeMounts:
            - name: storage
              mountPath: /app/api/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: api-storage

---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  ports:
    - port: 5001
      targetPort: 5001
  selector:
    app: api
